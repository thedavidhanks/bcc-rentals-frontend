name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs when new commits land on the same PR/branch so we don't
# burn minutes re-checking stale pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # lib/env.ts:28-33 parses process.env through Zod at module load and
        # throws if a required var (PayPal/Resend/Redis/DB secrets, etc.) is
        # missing, so a bare `next build` would crash here with none of those
        # secrets available. SKIP_ENV_VALIDATION=1 bypasses that parse for the
        # build only; every DB/product route is force-dynamic, so nothing
        # queries a live service while building. Verified locally that the
        # build does not require NEXT_PUBLIC_PAYPAL_CLIENT_ID (or any other
        # NEXT_PUBLIC_* var) to complete with this flag set.
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
